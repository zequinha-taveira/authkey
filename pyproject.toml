[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authkey-sdk"
version = "0.1.0"
authors = [
  { name = "authkey", email = "contact@authkey.io" },
]
description = "A professional Python library for FIDO2 Security Keys"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "fido2>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
]



[project.urls]
"Homepage" = "https://github.com/authkey/authkey-sdk"
"Bug Tracker" = "https://github.com/authkey/authkey-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP"]

[tool.mypy]
python_version = "3.8"
strict = true
ignore_missing_imports = true

